# Micronaut essentials only. All Altara settings (MongoDB, Redis, backend key, server name)
# come from config.json in the working directory, like every other Altara module.
micronaut.application.name=Altara-Web
micronaut.server.port=25001

# ── Caches (Caffeine) ─────────────────────────────────────────────────────────
# Names are the constants in games.sparking.altara.config.CacheConfig.

# Player profiles and their embedded data: hot while the player is online
micronaut.caches.profiles.maximum-size=1000
micronaut.caches.profiles.expire-after-write=5m
micronaut.caches.profiles.record-stats=true
micronaut.caches.profileAlts.maximum-size=500
micronaut.caches.profileAlts.expire-after-write=5m
micronaut.caches.profileAlts.record-stats=true
micronaut.caches.profileGrants.maximum-size=500
micronaut.caches.profileGrants.expire-after-write=5m
micronaut.caches.profileGrants.record-stats=true

# Ranks change rarely
micronaut.caches.ranks.maximum-size=200
micronaut.caches.ranks.expire-after-write=10m
micronaut.caches.ranks.record-stats=true

# UUID <-> name lookups: high cardinality, names rarely change
micronaut.caches.uuidByName.maximum-size=5000
micronaut.caches.uuidByName.expire-after-write=30m
micronaut.caches.uuidByName.record-stats=true
micronaut.caches.uuidByUuid.maximum-size=5000
micronaut.caches.uuidByUuid.expire-after-write=30m
micronaut.caches.uuidByUuid.record-stats=true

# Punishments: short TTLs where expiry is time-based
micronaut.caches.punishments.maximum-size=10000
micronaut.caches.punishments.expire-after-write=10m
micronaut.caches.punishments.record-stats=true
micronaut.caches.playerPunishments.maximum-size=5000
micronaut.caches.playerPunishments.expire-after-write=5m
micronaut.caches.playerPunishments.record-stats=true
micronaut.caches.playerActivePunishments.maximum-size=5000
micronaut.caches.playerActivePunishments.expire-after-write=1m
micronaut.caches.playerActivePunishments.record-stats=true
micronaut.caches.playerBanStatus.maximum-size=10000
micronaut.caches.playerBanStatus.expire-after-write=30s
micronaut.caches.playerBanStatus.record-stats=true
